<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ブックマーク編集 - Bookmark Manager</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="page">
    <section class="panel">
        <div class="section-heading">
            <div>
                <h1>ブックマーク編集</h1>
                <p th:text="${bookmark.url()}">https://example.com</p>
            </div>
            <a class="text-link" href="/">一覧へ戻る</a>
        </div>

        <form class="edit-form" method="post" th:action="@{/bookmarks/{id}(id=${bookmark.id()})}">
            <p class="form-error" th:if="${error != null}" th:text="${error}" role="alert" aria-live="assertive" aria-atomic="true">入力内容を確認してください。</p>
            <label>
                <span>タイトル</span>
                <input name="title" type="text" required maxlength="100" th:value="${title}">
            </label>
            <label>
                <span>メモ</span>
                <textarea name="description" rows="5" maxlength="300" th:text="${description}"></textarea>
            </label>
            <label>
                <span>タグ</span>
                <input name="tags" type="text" placeholder="Java, Spring Boot, SQLite" th:value="${tags}">
            </label>
            <div class="form-actions">
                <button type="submit">更新</button>
                <a class="button-secondary" href="/">キャンセル</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
